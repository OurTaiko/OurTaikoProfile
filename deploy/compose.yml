# OurTaikoProfile on ourtaiko-prod, beside Fanmade and the SSO: the server (API and website in
# one) joins their network and keeps its database (ourtaiko_profile, owned by the role
# ourtaiko_profile) in their PostgreSQL, the container ourtaiko-postgres.
# Layout on the server:
#   /opt/ourtaiko-profile/src            this repository
#   /etc/ourtaiko-profile/api.env        see api.env.example (root-only)
# The image is usually built on a build machine (docker buildx --platform linux/amd64) and
# loaded there, then started with up -d --no-build; building on the server also works.
# The 1Panel site profile.ourtaiko.org proxies HTTPS to 127.0.0.1:8093.
name: ourtaiko-profile
services:
  app:
    image: ourtaiko-profile:release
    build: ..
    container_name: ourtaiko-profile
    restart: unless-stopped
    env_file:
      - path: /etc/ourtaiko-profile/api.env
        format: raw
    environment:
      LISTEN_ADDR: 0.0.0.0:8083
    ports: ['127.0.0.1:8093:8083']
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8083/readyz']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [shared]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
networks:
  shared: {external: true, name: ourtaiko-shared}
